<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- House icon -->
  <g transform="translate(4,6)">
    <!-- Roof -->
    <polyline points="44,32 84,4 124,32" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Walls -->
    <rect x="50" y="32" width="68" height="54" rx="3" fill="none" stroke="#fff" stroke-width="6"/>
    <!-- Wrench -->
    <g transform="translate(62,44)">
      <line x1="6" y1="2" x2="18" y2="28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="6" cy="5" r="5" fill="none" stroke="#fff" stroke-width="3.5"/>
    </g>
    <!-- Water drop -->
    <g transform="translate(79,44)">
      <path d="M8,2 Q15,12 15,17 A7,7 0 0,1 1,17 Q1,12 8,2Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <!-- Gear -->
    <g transform="translate(95,42)">
      <circle cx="10" cy="13" r="4" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="10" cy="13" r="8" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 2.8"/>
    </g>
  </g>
  <!-- Text ВИзбу -->
  <text x="148" y="76" font-family="'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    <tspan fill="#ffffff">В</tspan><tspan fill="#F4A23A">И</tspan><tspan fill="#ffffff">збу</tspan>
  </text>
</svg>
