<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <!-- House icon -->
  <g transform="translate(8, 8)">
    <!-- Roof -->
    <polyline points="52,38 100,6 148,38" fill="none" stroke="#2D6A4F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Walls -->
    <rect x="58" y="38" width="84" height="66" rx="3" fill="none" stroke="#2D6A4F" stroke-width="7"/>
    <!-- Wrench -->
    <g transform="translate(72, 52)">
      <line x1="8" y1="2" x2="22" y2="34" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round"/>
      <circle cx="8" cy="6" r="6" fill="none" stroke="#2D6A4F" stroke-width="4"/>
    </g>
    <!-- Water drop -->
    <g transform="translate(93, 54)">
      <path d="M10,2 Q18,14 18,20 A8,8 0 0,1 2,20 Q2,14 10,2Z" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <!-- Gear -->
    <g transform="translate(113, 50)">
      <circle cx="12" cy="14" r="5" fill="none" stroke="#2D6A4F" stroke-width="3.5"/>
      <circle cx="12" cy="14" r="9" fill="none" stroke="#2D6A4F" stroke-width="3.5" stroke-dasharray="5.5 3.2"/>
    </g>
  </g>
  <!-- Text ВИзбу -->
  <text x="178" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
    <tspan fill="#2D6A4F">В</tspan><tspan fill="#F4A23A">И</tspan><tspan fill="#2D6A4F">збу</tspan>
  </text>
</svg>
